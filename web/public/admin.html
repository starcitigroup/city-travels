<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | City Travels</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --color-primary: #006994;
            --color-primary-dark: #005577;
            --color-secondary: #FF7F50;
            --color-secondary-dark: #e56b3d;
            --color-dark: #333333;
            --color-light: #F8F9FA;
            --color-white: #FFFFFF;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-400: #94a3b8;
            --color-gray-600: #475569;
            --color-error: #ef4444;
            --color-success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            background: var(--color-gray-100);
            color: var(--color-dark);
            min-height: 100vh;
            line-height: 1.6;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        /* Login Layout */
        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, #004d6d 100%);
        }

        .login-card {
            background: var(--color-white);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            shadow: var(--shadow-lg);
            text-align: center;
        }

        .login-logo {
            width: 60px;
            height: 60px;
            background: var(--color-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 0.5rem;
            color: var(--color-dark);
        }

        .login-sub {
            color: var(--color-gray-600);
            margin-bottom: 2rem;
            font-size: 14px;
        }

        /* Form Elements */
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray-600);
            margin-bottom: 6px;
            text-align: left;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--color-gray-200);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            margin-bottom: 1.25rem;
        }

        input:focus, textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 105, 148, 0.1);
        }

        textarea { min-height: 100px; resize: vertical; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--color-secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--color-secondary-dark);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--color-gray-300);
            color: var(--color-gray-600);
        }

        .btn-outline:hover {
            background: var(--color-gray-100);
            border-color: var(--color-gray-400);
        }

        .btn-danger {
            background: transparent;
            border-color: #fee2e2;
            color: var(--color-error);
        }

        .btn-danger:hover {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* App Layout */
        .header {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-gray-200);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            background: var(--color-primary);
            color: white;
            padding: 8px;
            border-radius: 8px;
            display: flex;
        }

        .header-title { font-size: 18px; color: var(--color-dark); }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: var(--color-gray-100);
            padding: 4px;
            border-radius: 12px;
        }

        .nav-tab {
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--color-gray-600);
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .nav-tab.active {
            background: var(--color-white);
            color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .main-content {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .toolbar-info h2 { font-size: 24px; margin-bottom: 4px; }
        .toolbar-info p { color: var(--color-gray-600); font-size: 14px; }

        /* Dashboard Cards */
        .data-card {
            background: var(--color-white);
            border-radius: 16px;
            border: 1px solid var(--color-gray-200);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .table-container { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }

        th {
            background: var(--color-gray-100);
            padding: 14px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-gray-600);
            border-bottom: 1px solid var(--color-gray-200);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-gray-100);
            vertical-align: middle;
            color: var(--color-dark);
        }

        tr:hover td { background-color: #fafafa; }

        .img-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--color-gray-100);
            border: 1px solid var(--color-gray-200);
        }

        .badge {
            display: inline-flex;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background: var(--color-gray-100);
            color: var(--color-gray-600);
        }

        /* Form Styling */
        .form-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            background: var(--color-white);
            border-radius: 20px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .form-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--color-gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .form-body { padding: 2rem; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
        .col-full { grid-column: span 2; }

        .image-field-group {
            background: var(--color-gray-100);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .image-preview-large {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 1px solid var(--color-gray-200);
        }

        .image-input-row { display: flex; gap: 10px; }

        /* Alerts */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }

        /* Modals & Uploads */
        .modal-small {
            width: 400px;
            padding: 2rem;
            text-align: center;
        }

        .upload-zone {
            border: 2px dashed var(--color-gray-300);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            margin: 1.5rem 0;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--color-gray-100);
        }

        .upload-zone:hover { border-color: var(--color-primary); background: #f0f7fa; }
        .upload-zone.drag-over { border-color: var(--color-secondary); background: #fff7f5; }

        .progress-bar {
            height: 8px;
            background: var(--color-gray-200);
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Utilities */
        .text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }
        .hidden { display: none !important; }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .col-full { grid-column: span 1; }
            .header { padding: 0 1rem; }
            .main-content { padding: 0 1rem; }
            .nav-tab { padding: 8px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(this)" />

    <script>
        const SUPABASE_URL = "https://upiwpzsyxmgroxqzmteo.supabase.co";
        const BUCKET = "travel-images";

        let state = {
            apiKey: "", 
            tab: "brochures",
            brochures: [], 
            testimonials: [],
            loading: false, 
            error: "", 
            success: "",
            showForm: false, 
            editing: null, 
            form: {},
            uploadModal: false, 
            uploadTarget: null,
            uploadFolder: "brochures", 
            uploading: false,
            uploadProgress: 0, 
            uploadedUrl: "", 
            uploadedFile: null
        };

        function hdrs(extra) {
            return Object.assign({
                "Content-Type": "application/json", 
                apikey: state.apiKey, 
                Authorization: `Bearer ${state.apiKey}`, 
                Prefer: "return=representation"
            }, extra || {});
        }

        async function api(method, table, id, body) {
            const url = id ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}` : `${SUPABASE_URL}/rest/v1/${table}?select=*&order=id.asc`;
            const res = await fetch(url, { method, headers: hdrs(), body: body ? JSON.stringify(body) : undefined });
            if (!res.ok) throw new Error(await res.text());
            if (method === "DELETE") return;
            const t = await res.text(); 
            return t ? JSON.parse(t) : [];
        }

        async function uploadImage(file, folder) {
            const ext = file.name.split(".").pop();
            const name = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
            const path = `${folder}/${name}`;
            const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
                method: "POST",
                headers: { 
                    apikey: state.apiKey, 
                    Authorization: `Bearer ${state.apiKey}`, 
                    "Content-Type": file.type, 
                    "x-upsert": "true" 
                },
                body: file
            });
            if (!res.ok) throw new Error(await res.text());
            return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
        }

        async function loadData() {
            state.loading = true; render();
            try {
                state.brochures = await api("GET", "brochures");
                state.testimonials = await api("GET", "testimonials");
                state.error = "";
            } catch (e) { 
                state.error = "Connection failed: " + e.message; 
            }
            state.loading = false; render();
        }

        function toForm(item, type) {
            if (!item) return type === "brochures" 
                ? { title: "", duration: "", highlights: "", image: "", file: "", price: "" } 
                : { name: "", role: "", content: "", location: "", image: "", trip_image: "" };
            
            if (type === "brochures") return { ...item, highlights: (item.highlights || []).join(", ") };
            return { ...item };
        }

        function fromForm(form, type) {
            if (type === "brochures") {
                const d = { ...form };
                d.highlights = (form.highlights || "").split(",").map(s => s.trim()).filter(Boolean);
                delete d.id; delete d.created_at;
                if (!d.price) d.price = null; 
                if (!d.file) d.file = null;
                return d;
            }
            const d = { ...form }; 
            delete d.id; delete d.created_at;
            if (!d.image) d.image = null; 
            if (!d.trip_image) d.trip_image = null;
            return d;
        }

        async function saveForm() {
            state.loading = true; render();
            try {
                const data = fromForm(state.form, state.tab);
                if (state.editing) { 
                    await api("PATCH", state.tab, state.editing.id, data); 
                    state.success = "Record updated successfully!"; 
                }
                else { 
                    await api("POST", state.tab, null, data); 
                    state.success = "New record added successfully!"; 
                }
                state.showForm = false; state.editing = null; state.form = {};
                await loadData();
            } catch (e) { 
                state.error = e.message; 
                state.loading = false; 
                render(); 
            }
        }

        async function deleteItem(id) {
            if (!confirm("Are you sure you want to delete this record? This action cannot be undone.")) return;
            state.loading = true; render();
            try { 
                await api("DELETE", state.tab, id); 
                state.success = "Record deleted successfully."; 
                await loadData(); 
            }
            catch (e) { 
                state.error = e.message; 
                state.loading = false; 
                render(); 
            }
        }

        function openUploadModal(target) {
            state.uploadModal = true; 
            state.uploadTarget = target;
            state.uploadFolder = state.tab === "brochures" ? "brochures" : "testimonials";
            state.uploadedUrl = ""; state.uploadedFile = null; state.uploading = false;
            render();
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                state.uploadedFile = input.files[0];
                doUpload();
            }
        }

        async function doUpload() {
            if (!state.uploadedFile) return;
            state.uploading = true; 
            state.uploadProgress = 30; 
            render();
            try {
                state.uploadProgress = 60; render();
                const url = await uploadImage(state.uploadedFile, state.uploadFolder);
                state.uploadProgress = 100; 
                state.uploadedUrl = url; 
                state.uploading = false;
                render();
            } catch (e) {
                state.error = "Upload failed: " + e.message;
                state.uploadModal = false; state.uploading = false; 
                render();
            }
        }

        function applyUploadedUrl() {
            if (!state.uploadedUrl) return;
            state.form[state.uploadTarget] = state.uploadedUrl;
            state.uploadModal = false; state.uploadedUrl = ""; state.uploadedFile = null;
            render();
        }

        function render() {
            const app = document.getElementById("app");
            app.innerHTML = !state.apiKey || (state.error && state.error.includes("Connection failed"))
                ? renderLogin()
                : renderAdmin();
            
            // Initialize Lucide icons after render
            lucide.createIcons();
        }

        function renderLogin() {
            return `
            <div class="login-wrap">
                <div class="login-card">
                    <div class="login-logo"><i data-lucide="plane"></i></div>
                    <h1 class="login-title">Admin Portal</h1>
                    <p class="login-sub">Sign in with your Supabase Service Role Key</p>
                    
                    ${state.error ? `<div class="alert alert-error"><i data-lucide="alert-circle"></i> ${state.error}</div>` : ""}
                    
                    <div style="margin-bottom: 1.5rem">
                        <label>Service Role Key</label>
                        <input type="password" id="keyInput" placeholder="eyJhbG..." value="${state.apiKey || ""}" />
                        <p style="font-size: 11px; color: var(--color-gray-400); margin-top: -10px; text-align: left;">
                            Found in Supabase → Project Settings → API
                        </p>
                    </div>
                    
                    <button class="btn btn-primary" style="width: 100%" onclick="doConnect()">
                        <i data-lucide="shield-check"></i> Authenticate
                    </button>
                </div>
            </div>`;
        }

        function renderAdmin() {
            const items = state.tab === "brochures" ? state.brochures : state.testimonials;
            return `
            ${state.uploadModal ? renderUploadModal() : ""}
            ${state.showForm ? renderFormOverlay() : ""}

            <header class="header">
                <div class="header-brand">
                    <div class="header-logo"><i data-lucide="map"></i></div>
                    <h1 class="header-title">City Travels <span style="color: var(--color-gray-400); font-weight: 400; margin-left: 8px;">Admin</span></h1>
                </div>

                <nav class="nav-tabs">
                    <button class="nav-tab ${state.tab === "brochures" ? "active" : ""}" onclick="switchTab('brochures')">
                        <i data-lucide="book-open" style="width: 16px; height: 16px; display: inline; vertical-align: text-bottom; margin-right: 4px;"></i> Brochures
                    </button>
                    <button class="nav-tab ${state.tab === "testimonials" ? "active" : ""}" onclick="switchTab('testimonials')">
                        <i data-lucide="message-square" style="width: 16px; height: 16px; display: inline; vertical-align: text-bottom; margin-right: 4px;"></i> Testimonials
                    </button>
                </nav>

                <button class="btn btn-outline btn-sm" onclick="doLogout()">
                    <i data-lucide="log-out"></i> Disconnect
                </button>
            </header>

            <main class="main-content">
                ${state.error ? `
                    <div class="alert alert-error">
                        <i data-lucide="alert-circle"></i>
                        <span style="flex: 1">${state.error}</span>
                        <button onclick="state.error='';render()" style="border:none;background:none;cursor:pointer;color:inherit"><i data-lucide="x"></i></button>
                    </div>` : ""}
                
                ${state.success ? `
                    <div class="alert alert-success">
                        <i data-lucide="check-circle"></i>
                        <span style="flex: 1">${state.success}</span>
                        <button onclick="state.success='';render()" style="border:none;background:none;cursor:pointer;color:inherit"><i data-lucide="x"></i></button>
                    </div>` : ""}

                <div class="toolbar">
                    <div class="toolbar-info">
                        <h2>${state.tab === "brochures" ? "Manage Brochures" : "Customer Testimonials"}</h2>
                        <p>Total records: ${items.length}</p>
                    </div>
                    <button class="btn btn-secondary" onclick="openAdd()">
                        <i data-lucide="plus"></i> Add New Record
                    </button>
                </div>

                <div class="data-card">
                    <div class="table-container">
                        ${state.loading ? `
                            <div style="padding: 4rem; text-align: center; color: var(--color-gray-400);">
                                <i data-lucide="loader" class="animate-spin" style="margin-bottom: 1rem"></i>
                                <p>Loading data...</p>
                            </div>
                        ` : items.length === 0 ? `
                            <div style="padding: 4rem; text-align: center; color: var(--color-gray-400);">
                                <i data-lucide="database" style="width: 48px; height: 48px; margin-bottom: 1rem"></i>
                                <p>No records found in this category.</p>
                            </div>
                        ` : state.tab === "brochures" ? renderBrochuresTable(items) : renderTestimonialsTable(items)}
                    </div>
                </div>
            </main>`;
        }

        function renderFormOverlay() {
            const f = state.form; 
            const isEdit = !!state.editing;
            
            return `
            <div class="form-overlay">
                <div class="form-container">
                    <div class="form-header">
                        <h3 class="font-heading">${isEdit ? 'Edit Record' : 'Add New Record'}</h3>
                        <button onclick="cancelForm()" class="btn btn-outline btn-sm"><i data-lucide="x"></i></button>
                    </div>
                    <div class="form-body">
                        <div class="form-grid">
                            ${state.tab === "brochures" ? renderBrochureFields(f) : renderTestimonialFields(f)}
                        </div>
                        
                        <div style="display: flex; gap: 12px; margin-top: 2rem; border-top: 1px solid var(--color-gray-200); padding-top: 1.5rem;">
                            <button class="btn btn-primary" style="flex: 1" onclick="saveForm()" ${state.loading ? "disabled" : ""}>
                                <i data-lucide="save"></i> ${state.loading ? "Saving..." : "Save Record"}
                            </button>
                            <button class="btn btn-outline" onclick="cancelForm()">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderBrochureFields(f) {
            return `
            <div class="col-full">
                <label>Package Title</label>
                <input value="${f.title || ""}" oninput="state.form.title=this.value" placeholder="e.g. Munnar Escape" />
            </div>
            <div>
                <label>Duration</label>
                <input value="${f.duration || ""}" oninput="state.form.duration=this.value" placeholder="e.g. 3 Days / 2 Nights" />
            </div>
            <div>
                <label>Starting Price (Optional)</label>
                <input value="${f.price || ""}" oninput="state.form.price=this.value" placeholder="e.g. ₹4,500" />
            </div>
            <div class="col-full">
                <label>Highlights (Comma separated)</label>
                <textarea oninput="state.form.highlights=this.value" placeholder="Sightseeing, Breakfast, Transfers...">${f.highlights || ""}</textarea>
            </div>
            <div class="col-full">
                ${imgFieldUI("Cover Image", "image")}
            </div>
            <div class="col-full">
                ${imgFieldUI("Brochure File (URL)", "file")}
            </div>
            `;
        }

        function renderTestimonialFields(f) {
            return `
            <div>
                <label>Customer Name</label>
                <input value="${f.name || ""}" oninput="state.form.name=this.value" />
            </div>
            <div>
                <label>Location</label>
                <input value="${f.location || ""}" oninput="state.form.location=this.value" />
            </div>
            <div class="col-full">
                <label>Role / Trip Type</label>
                <input value="${f.role || ""}" oninput="state.form.role=this.value" placeholder="e.g. Honeymooners, Solo Traveler" />
            </div>
            <div class="col-full">
                <label>Review Content</label>
                <textarea oninput="state.form.content=this.value">${f.content || ""}</textarea>
            </div>
            <div class="col-full">
                ${imgFieldUI("Profile Photo", "image")}
            </div>
            <div class="col-full">
                ${imgFieldUI("Trip Photo", "trip_image")}
            </div>
            `;
        }

        function imgFieldUI(label, key) {
            const val = state.form[key] || "";
            return `
            <div class="image-field-group">
                <label>${label}</label>
                ${val ? `<img src="${val}" class="image-preview-large" onerror="this.style.display='none'" />` : ''}
                <div class="image-input-row">
                    <input value="${val}" style="margin-bottom: 0" oninput="state.form['${key}']=this.value;render()" placeholder="https://supabase.co/..." />
                    <button class="btn btn-secondary btn-sm" onclick="openUploadModal('${key}')">
                        <i data-lucide="upload"></i> Upload
                    </button>
                </div>
            </div>`;
        }

        function renderBrochuresTable(items) {
            return `
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px">ID</th>
                        <th style="width: 80px">Cover</th>
                        <th>Package Info</th>
                        <th>Highlights</th>
                        <th style="width: 100px">Price</th>
                        <th style="width: 150px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${items.map(b => `
                    <tr>
                        <td class="badge">${b.id}</td>
                        <td>
                            <img class="img-thumb" src="${b.image || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'">
                        </td>
                        <td>
                            <div style="font-weight: 600">${b.title}</div>
                            <div style="font-size: 12px; color: var(--color-gray-400)"><i data-lucide="clock" style="width:12px; height:12px; display:inline"></i> ${b.duration}</div>
                        </td>
                        <td>
                            <div class="text-truncate" title="${(b.highlights || []).join(", ")}">
                                ${(b.highlights || []).join(" • ")}
                            </div>
                        </td>
                        <td style="font-weight: 700; color: var(--color-primary)">${b.price || "—"}</td>
                        <td>
                            <div style="display: flex; gap: 8px">
                                <button class="btn btn-outline btn-sm" onclick="openEdit(${b.id})"><i data-lucide="edit-3"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem(${b.id})"><i data-lucide="trash-2"></i></button>
                            </div>
                        </td>
                    </tr>`).join("")}
                </tbody>
            </table>`;
        }

        function renderTestimonialsTable(items) {
            return `
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px">ID</th>
                        <th style="width: 80px">Profile</th>
                        <th>Customer</th>
                        <th>Content</th>
                        <th style="width: 150px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${items.map(t => `
                    <tr>
                        <td class="badge">${t.id}</td>
                        <td>
                            <img class="img-thumb" style="border-radius: 50%" src="${t.image || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'">
                        </td>
                        <td>
                            <div style="font-weight: 600">${t.name}</div>
                            <div style="font-size: 12px; color: var(--color-gray-400)"><i data-lucide="map-pin" style="width:12px; height:12px; display:inline"></i> ${t.location}</div>
                        </td>
                        <td>
                            <div class="text-truncate" style="font-style: italic" title="${t.content}">
                                "${t.content}"
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; gap: 8px">
                                <button class="btn btn-outline btn-sm" onclick="openEdit(${t.id})"><i data-lucide="edit-3"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem(${t.id})"><i data-lucide="trash-2"></i></button>
                            </div>
                        </td>
                    </tr>`).join("")}
                </tbody>
            </table>`;
        }

        function renderUploadModal() {
            return `
            <div class="form-overlay" style="z-index: 2000">
                <div class="form-container modal-small">
                    <h3 class="font-heading" style="margin-bottom: 1rem">Upload Image</h3>
                    <p style="color: var(--color-gray-600); font-size: 13px; margin-bottom: 1.5rem">
                        Destination: <span class="badge">travel-images/${state.uploadFolder}/</span>
                    </p>

                    ${state.uploading ? `
                        <div style="padding: 2rem 0">
                            <p style="font-weight: 600; margin-bottom: 0.5rem">Uploading your file...</p>
                            <div class="progress-bar"><div class="progress-fill" style="width: ${state.uploadProgress}%"></div></div>
                        </div>
                    ` : state.uploadedUrl ? `
                        <div style="padding: 1rem 0">
                            <i data-lucide="check-circle" style="color: var(--color-success); width: 48px; height: 48px; margin: 0 auto 1rem"></i>
                            <img src="${state.uploadedUrl}" style="width: 100%; border-radius: 12px; margin-bottom: 1rem" />
                            <div style="display: flex; gap: 10px">
                                <button class="btn btn-primary" style="flex: 1" onclick="applyUploadedUrl()">Use Image</button>
                                <button class="btn btn-outline" onclick="state.uploadedUrl='';render()">Redo</button>
                            </div>
                        </div>
                    ` : `
                        <div class="upload-zone" onclick="document.getElementById('fileInput').click()" 
                             ondragover="event.preventDefault();this.classList.add('drag-over')"
                             ondragleave="this.classList.remove('drag-over')"
                             ondrop="event.preventDefault();this.classList.remove('drag-over');handleDrop(event)">
                            <i data-lucide="cloud-upload" style="width: 40px; height: 40px; color: var(--color-primary); margin-bottom: 1rem"></i>
                            <p style="font-weight: 600">Click or drag image here</p>
                            <p style="font-size: 12px; color: var(--color-gray-400)">Supports JPG, PNG, WebP (Max 5MB)</p>
                        </div>
                    `}

                    <button class="btn btn-outline btn-sm" style="margin-top: 1rem" onclick="state.uploadModal=false;render()">Cancel</button>
                </div>
            </div>`;
        }

        function handleDrop(e) {
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) { 
                state.uploadedFile = file; 
                doUpload(); 
            }
        }

        function doConnect() { 
            const k = document.getElementById("keyInput")?.value?.trim(); 
            if (!k) return; 
            state.apiKey = k; 
            state.error = ""; 
            loadData(); 
        }

        function doLogout() { 
            state.apiKey = ""; 
            state.brochures = []; 
            state.testimonials = []; 
            state.error = ""; 
            render(); 
        }

        function switchTab(t) { 
            state.tab = t; 
            state.showForm = false; 
            state.editing = null; 
            state.form = {}; 
            render(); 
        }

        function openAdd() { 
            state.showForm = true; 
            state.editing = null; 
            state.form = toForm(null, state.tab); 
            render(); 
        }

        function openEdit(id) {
            const item = state.tab === "brochures" 
                ? state.brochures.find(b => b.id === id) 
                : state.testimonials.find(t => t.id === id);
            state.showForm = true; 
            state.editing = item; 
            state.form = toForm(item, state.tab); 
            render();
        }

        function cancelForm() { 
            state.showForm = false; 
            state.editing = null; 
            state.form = {}; 
            render(); 
        }

        render();
    </script>
</body>
</html>
